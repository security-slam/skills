# Gemara v1 capability catalog example, adapted from the Security Slam 2026
# Threat Assessment Guide (which used the pre-v1 single-file format).
metadata:
  id: SEC.SLAM.CM.CAPS
  type: CapabilityCatalog
  gemara-version: "1.5.0"
  version: "1.0.0"
  description: Capabilities of a container management tool
  author:
    id: example
    name: Example
    type: Human
  mapping-references:
    - id: CCC
      title: Common Cloud Controls Core
      version: v2025.10
      url: https://github.com/finos/common-cloud-controls/releases
      description: Reusable security controls, capabilities, and threats maintained by FINOS.

title: Container Management Tool Capabilities

groups:
  - id: image-management
    title: Image Management
    description: Retrieving and resolving container images

imports:
  - reference-id: CCC
    entries:
      - reference-id: CCC.Core.CP29
        remarks: Active Ingestion
      - reference-id: CCC.Core.CP18
        remarks: Resource Versioning

capabilities:
  - id: SEC.SLAM.CM.CAP01
    title: Image Retrieval by Tag
    description: |
      Retrieves container images from registries using mutable tag names
      such as 'latest' or 'v1.0'.
    group: image-management
