---
name: "Release"
on:
  workflow_dispatch:
  # pull_request_target runs from the base branch and never checks out PR code
  pull_request_target:
    types: [closed]
    branches: [main]
    # Release only when the installable plugin changes; CI and docs merges never release
    paths:
      - "security-slam-skills/**"
      - ".claude-plugin/marketplace.json"

permissions: {}

# Serialize releases so two merges cannot race on the same tag
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    # A manual run releases only from main, never from another branch
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: write # Create releases and push tags
      pull-requests: read # Read PR labels for release-drafter
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/release-minimal.yaml@038160c3e14227cf7c1a7387217ac1623a969f0c # v2.1.1
    with:
      # Configuration file for release-drafter, relative to .github/
      release-config-name: release-drafter.yml
      publish: true
      # Only release when the 'release' label is on the merged PR. The
      # auto-labeler applies it to any PR that touches the plugin.
      release-only-with-label: true
      # plugin.json is the source of truth for the release version
      version-file: security-slam-skills/.claude-plugin/plugin.json
      version-key: .version
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
