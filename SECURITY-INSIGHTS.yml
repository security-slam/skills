header:
  schema-version: 2.2.0
  last-updated: '2026-10-01'
  last-reviewed: '2026-10-01'
  url: https://github.com/security-slam/skills/raw/main/SECURITY-INSIGHTS.yml

project:
  name: security-slam-skills
  homepage: https://github.com/security-slam/skills
  administrators:
    - name: Jason Meridth
      email: jmeridth@gmail.com
      primary: true
  repositories:
    - name: skills
      url: https://github.com/security-slam/skills
      comment: Primary repository. Holds the security-slam plugin marketplace and the security-slam-skills plugin.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/security-slam/skills/blob/main/SECURITY.md
    contact:
      name: Jason Meridth
      email: jmeridth@gmail.com
      primary: true
    comment: Report vulnerabilities through GitHub private vulnerability reporting on security-slam/skills.
  documentation:
    quickstart-guide: https://github.com/security-slam/skills/blob/main/README.md#install
    detailed-guide: https://github.com/security-slam/skills/blob/main/README.md
    release-process: https://github.com/security-slam/skills/blob/main/README.md#releasing
    support-policy: https://github.com/security-slam/skills/blob/main/SECURITY.md#support-period-and-end-of-life

repository:
  url: https://github.com/security-slam/skills
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: Jason Meridth
      email: jmeridth@gmail.com
      primary: true
    - name: Eddie Knight
      social: https://github.com/eddie-knight
      primary: false
  documentation:
    contributing-guide: https://github.com/security-slam/skills/blob/main/CONTRIBUTING.md
    security-policy: https://github.com/security-slam/skills/blob/main/SECURITY.md
  license:
    url: https://github.com/security-slam/skills/blob/main/LICENSE
    expression: Apache-2.0
  release:
    automated-pipeline: true
    changelog: https://github.com/security-slam/skills/releases
    distribution-points:
      - uri: https://github.com/security-slam/skills/releases
        comment: GitHub releases, published by the release workflow when a plugin change merges.
  security:
    assessments:
      self:
        comment: A self-assessment has not been completed yet.
      third-party:
        - name: OpenSSF Best Practices OSPS Baseline
          evidence: https://www.bestpractices.dev/projects/15132
          date: '2026-10-01'
          comment: OSPS Baseline Level 1 (criteria v2026.08.28), self-reported on bestpractices.dev with autodetected answers.
    tools:
      - name: Dependabot
        type: SCA
        comment: Weekly version updates for GitHub Actions, plus Dependabot alerts on the repository.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
      - name: OSPS Baseline Scanner
        type: other
        comment: Weekly and on every push to main, the OSPS Baseline action runs the pvtr-github-repo-scanner against Maturity Level 1 controls.
        rulesets:
          - osps-baseline-2026-08
        integration:
          adhoc: false
          ci: true
          release: false
        results:
          ci:
            name: OSPS Baseline evaluation
            predicate-uri: https://github.com/revanite-io/osps-baseline-action
            location: https://github.com/security-slam/skills/actions/workflows/osps-baseline.yaml
